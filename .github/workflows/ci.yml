name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node || '.nvmrc' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22' # engines.node floor
          - node-file: .nvmrc # Active LTS, single source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          node-version-file: ${{ matrix.node-file }}
          cache: npm
      - run: npm ci
      - run: npm test

  # The merge gate (#35): branch protection is unavailable on this plan, so merges wait on
  # this one status. It must need every other job (test/ci.test.mjs checks) and run even
  # when one fails, so a failed or skipped dependency reports as a failed `All checks`.
  all-checks:
    name: All checks
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: ${RESULTS:-<none>}"
          [ -n "$RESULTS" ] || { echo "no results to check"; exit 1; }
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a needed job ended with: $r"; exit 1; }
          done
