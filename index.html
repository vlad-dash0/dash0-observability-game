<!DOCTYPE html>
<html lang="en">
<head>
<!-- Stub from F1 (#9); F5 (#13) owns this file. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dash0 Observability Game</title>
<!-- App logic is an ES module (main.mjs), never an inline <script>, so the CSP keeps
     'unsafe-inline' out of script-src. main.mjs registers the Alpine component on
     `alpine:init`, so it must load before Alpine starts: both scripts are deferred and
     run in document order. Alpine.js is self-hosted (vendor/) so the app never depends
     on a third-party CDN being reachable. -->
<script type="module" src="/main.mjs"></script>
<script defer src="/vendor/alpine-3.14.1.min.js"></script>
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/base.css">
<link rel="stylesheet" href="/styles/hub.css">
</head>
<body>
<div class="app" x-data="game"></div>
</body>
</html>
