<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>On Call: a Dash0 observability game</title>
<!-- App logic is an ES module (main.mjs), never an inline <script>, so the CSP keeps
     'unsafe-inline' out of script-src. main.mjs registers the Alpine component on
     `alpine:init`, so it must load before Alpine starts: both scripts are deferred and
     run in document order. Alpine.js is self-hosted (vendor/) so the app never depends
     on a third-party CDN being reachable. -->
<script type="module" src="/main.mjs"></script>
<script defer src="/vendor/alpine-3.14.1.min.js"></script>
<!-- Stylesheets in cascade order: tokens, reset and legacy components, the UI kit
     (docs/DESIGN-SYSTEM.md), widget layouts around it, then the hub shell. -->
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/base.css">
<link rel="stylesheet" href="/styles/kit.css">
<link rel="stylesheet" href="/styles/widgets.css">
<link rel="stylesheet" href="/styles/hub.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<div class="app" x-data="game" @keydown.escape.window="onEscape($event)">

  <!-- The hub: inert while the level or reward dialog is open, so Tab and Enter cannot
       reach the cards behind it. Alpine removes the attribute when the value is false. -->
  <div id="hub" :inert="overlayOpen || rewardOpen">
    <header class="hub-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">0</span>
        <span class="brand-name">On Call <span>by Dash0</span></span>
      </div>
      <div class="head-right">
        <span class="debug-badge" x-show="debug" x-cloak>DEBUG</span>
        <!-- A live region announces its text, not aria-label changes: the spoken summary
             is visually hidden text inside it. -->
        <div class="star-count" role="status">
          <span aria-hidden="true">&#9733;</span>
          <span aria-hidden="true" x-text="stars.earned + ' / ' + stars.max">0 / 0</span>
          <span class="visually-hidden" x-text="starSummary()"></span>
        </div>
        <!-- The buttons in this file are the kit's (docs/DESIGN-SYSTEM.md; the one static
             place that writes ui- classes by hand): the markup lib/ui/button.mjs makes. -->
        <button type="button" class="ui-btn ui-btn--icon" id="theme-toggle" @click="toggleTheme()" :aria-label="themeLabel()"
                :title="themeLabel()">
          <span aria-hidden="true" x-text="theme === 'light' ? '☾' : '☀'">&#9728;</span>
        </button>
      </div>
    </header>

    <!-- Always rendered (a hidden live region would not announce); .show draws the box. -->
    <p class="notice" role="status" :class="notice ? 'show' : ''" x-text="noticeText()"></p>

    <!-- WORLD MAP. lib/globe-render.mjs draws a three.js globe into .globe-stage (act = region,
         level = country); its canvas is sized by CSS classes, never a style attribute (CSP
         style-src 'self'). Without WebGL the list below takes its place. -->
    <section class="map-panel" aria-labelledby="map-title">
      <h2 id="map-title" class="section-label" tabindex="-1">World map</h2>
      <p class="visually-hidden" role="status" x-text="litNote"></p>
      <div class="globe" x-show="!globeFallback">
        <div class="globe-stage" role="img" :aria-label="mapLabel()"></div>
        <p class="globe-hint" aria-hidden="true">Drag to rotate</p>
        <p class="globe-legend">
          <span><i class="globe-key lit" aria-hidden="true"></i>Lit: level completed</span>
          <span><i class="globe-key pulse" aria-hidden="true"></i>Pulsing: incident open</span>
          <span><i class="globe-key" aria-hidden="true"></i>Not reached</span>
          <span><i class="globe-key soon" aria-hidden="true"></i>Coming soon</span>
        </p>
      </div>
      <ul class="globe-fallback" x-show="globeFallback" x-cloak>
        <template x-for="line in globeLines()" :key="line">
          <li x-text="line"></li>
        </template>
      </ul>
    </section>

    <section class="levels" aria-labelledby="levels-title">
      <h2 id="levels-title" class="section-label">Levels</h2>
      <p class="empty-state" x-show="!hasLevels" x-cloak>
        Levels coming soon. Each one you finish lights up part of the map.
      </p>
      <template x-for="act in acts" :key="act.id">
        <div class="act" :class="act.soon ? 'soon' : ''">
          <h3 class="act-title"><span x-text="'Act ' + act.no"></span>: <span x-text="act.name"></span></h3>
          <p class="act-sub" x-show="act.sub" x-text="act.sub"></p>
          <div class="act-soon" x-show="act.soon"><p class="act-soon-chip"><span class="ui-chip" data-tone="neutral">Coming soon</span></p><p class="act-soon-teaser" x-text="act.teaser"></p></div>
          <div class="level-list">
            <template x-for="id in act.ids" :key="id">
              <div class="level-card"
                   role="button" tabindex="0"
                   :data-level-id="id"
                   :aria-disabled="levelState(id) === 'locked' ? 'true' : 'false'"
                   :aria-label="levelLabel(id)"
                   :class="levelClasses(id)"
                   @click="openLevel(id)"
                   @keydown.enter.prevent="openLevel(id)"
                   @keydown.space.prevent="openLevel(id)">
                <div class="level-ico" aria-hidden="true" x-text="level(id).icon"></div>
                <div class="level-body">
                  <div class="level-no" x-text="level(id).kind === 'boss' ? 'Incident' : level(id).no"></div>
                  <div class="level-name" x-text="level(id).name"></div>
                  <div class="level-sub" aria-live="polite" x-text="levelSub(id)"></div>
                </div>
                <div class="level-status" aria-hidden="true">
                  <span class="level-stars" x-show="levelState(id) === 'done' &amp;&amp; level(id).scored" x-text="starText(id)"></span>
                  <span x-text="levelState(id) === 'done' ? 'Play again' : levelState(id) === 'open' ? 'Start' : 'Locked'"></span>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </section>
  </div>

  <!-- LEVEL OVERLAY. Levels render into ov-body / ov-actions (found by id) with
       ctx.renderStep and wire buttons with el.onclick. x-ignore only keeps Alpine off
       the initial markup: Alpine still initialises nodes added later, so level markup
       must not use Alpine attributes (x-, @, :). -->
  <div class="overlay" :class="overlayOpen ? 'show' : ''" x-cloak
       role="dialog" aria-modal="true" :aria-label="overlayTitle">
    <div class="lesson-top">
      <button type="button" class="ui-btn ui-btn--icon" id="ov-back" aria-label="Back to the map" @click="closeOverlay()"><span aria-hidden="true">&larr;</span></button>
      <h2 x-text="overlayTitle"></h2>
    </div>
    <div class="level-host" x-ignore>
      <div class="lesson-scroll" id="ov-body"></div>
      <div class="lesson-actions" id="ov-actions"></div>
    </div>
  </div>

  <!-- REWARD -->
  <div class="reward" :class="rewardOpen ? 'show' : ''" x-cloak
       role="dialog" aria-modal="true" aria-labelledby="reward-title">
    <div class="reward-card">
      <h2 id="reward-title" x-text="rewardTitle"></h2>
      <p class="reward-stars" role="img" :aria-label="rewardStarsLabel()" x-show="rewardStars !== null"
         x-text="rewardStarsText()"></p>
      <p x-text="rewardText"></p>
      <p x-show="rewardDebug" x-cloak x-text="rewardNote()"></p>
      <div class="reward-cards" x-show="rewardCards.length > 0">
        <p class="reward-cards-title">New nuance card</p>
        <template x-for="front in rewardCards" :key="front">
          <p class="nuance-card" x-text="front"></p>
        </template>
      </div>
      <button type="button" class="ui-btn ui-btn--primary" id="reward-close" @click="closeReward()">Back to the map</button>
    </div>
  </div>

</div>
</body>
</html>
